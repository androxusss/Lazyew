              '  recentCapturedNotifications.take(50);\n  if (appStateSettings["notificationScanning"] == true) {\n    queueTransactionFromMessage(messageString);\n  }')

          # 5) Recordatorio diario con botones
          rep("lib/widgets/notificationsSettings.dart",
              "    'Transaction Reminders',\n    importance: Importance.max,",
              "    'Transaction Reminders',\n    actions: <AndroidNotificationAction>[\n      AndroidNotificationAction('lazyew_nothing', 'Nothing today'),\n      AndroidNotificationAction('lazyew_register', 'Register',\n          showsUserInterface: true),\n    ],\n    importance: Importance.max,")

          # 6) Ajustes: seccion nueva "Lazyew" y sin banner de donacion
          f = "lib/pages/settingsPage.dart"
          rep(f, "import 'package:budget/widgets/navigationFramework.dart';",
              "import 'package:budget/widgets/navigationFramework.dart';\nimport 'package:budget/pages/lazyewPages.dart';")
          rep(f, "          Padding(\n            padding: const EdgeInsetsDirectional.only(bottom: 8.0),\n            child: PremiumBanner(),\n          ),\n          MorePages()",
              "          LazyewSettingsSection(),\n          MorePages()")

          # 7) Pantalla principal: marca y gasto rapido
          f = "lib/pages/homePage/homePage.dart"
          rep(f, "import 'package:budget/widgets/navigationFramework.dart';",
              "import 'package:budget/widgets/navigationFramework.dart';\nimport 'package:budget/pages/lazyewPages.dart';")
          rep(f, "                      KeepAliveClientMixin(child: HomePageRatingBox()),",
              "                      LazyewHomeExtras(),")
          # 8) Sin pantallas de donacion / Pro / calificar
          rep("lib/pages/premiumPage.dart", "bool premiumPopupEnabled = kIsWeb == false;", "bool premiumPopupEnabled = false;")

          # 9) Donde decia Cashew ahora dice Lazyew
          import glob
          for path in glob.glob(os.path.join(ROOT, "assets/translations/generated/*.json")):
              with open(path, encoding="utf-8") as fh:
                  t = fh.read()
              with open(path, "w", encoding="utf-8") as fh:
                  fh.write(t.replace("Cashew", "Lazyew"))
          rep_all("lib/struct/uploadAttachment.dart", 'String folderName = "Cashew";', 'String folderName = "Lazyew";')
          rep_all("lib/pages/autoTransactionsPageEmail.dart", "Cashew", "Lazyew")
          rep_all("lib/widgets/showChangelog.dart", "Cashew", "Lazyew")
          rep_all("lib/widgets/accountAndBackup.dart", '"cashew-"', '"lazyew-"')
          rep_all("lib/widgets/exportDB.dart", '"cashew-"', '"lazyew-"')
          rep_all("lib/widgets/exportCSV.dart", '"cashew-"', '"lazyew-"')
          rep_all("lib/widgets/importCSV.dart", '"cashew-import-template"', '"lazyew-import-template"')
          # 10) Widget de gasto rapido (AndroidManifest)
          rep("android/app/src/main/AndroidManifest.xml",
              '        <receiver android:name="PlusWidgetProvider"',
              '        <receiver android:name=".LazyewQuickWidgetProvider"\n            android:exported="true" android:label="Lazyew Quick Add">\n            <intent-filter>\n                <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />\n            </intent-filter>\n            <meta-data android:name="android.appwidget.provider"\n                android:resource="@xml/lazyew_quick_widget_info" />\n        </receiver>\n        <activity android:name=".LazyewQuickAddActivity"\n            android:exported="false"\n            android:theme="@android:style/Theme.Translucent.NoTitleBar"\n            android:excludeFromRecents="true"\n            android:taskAffinity=""\n            android:windowSoftInputMode="stateVisible"\n            android:launchMode="singleTask" />\n        <receiver android:name="PlusWidgetProvider"')

          # 11) Edit Home: interruptor del gasto rapido
          f = "lib/pages/editHomePage.dart"
          rep(f, "import 'package:budget/colors.dart';",
              "import 'package:budget/colors.dart';\nimport 'package:budget/pages/lazyewPages.dart';")
          rep(f, "          SliverReorderableList(\n            onReorderStart:",
              "          SliverToBoxAdapter(child: LazyewEditHomeQuickAddRow()),\n          SliverReorderableList(\n            onReorderStart:")
          print("Lazyew aplicado correctamente")
          LAZYEW_EOF_10
          python3 lazyew_patch/apply_lazyew.py budget

