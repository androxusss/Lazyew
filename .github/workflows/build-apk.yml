name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Preparar la firma de la app
        working-directory: budget/android
        run: |
          echo "" | base64 -d > app/release.jks
          printf 'storePassword=cashew-personal-2026\nkeyPassword=cashew-personal-2026\nkeyAlias=cashewpersonal\nstoreFile=release.jks\n' > key.properties

      - name: Descargar dependencias
        working-directory: budget
        run: flutter pub get

      - name: Compilar APK
        working-directory: budget
        run: flutter build apk --release --target-platform android-arm64

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: cashew-apk
          path: budget/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
