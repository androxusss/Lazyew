        working-directory: budget/android
        run: |
          echo "" | base64 -d > app/release.jks
          printf 'storePassword=cashew-personal-2026\nkeyPassword=cashew-personal-2026\nkeyAlias=cashewpersonal\nstoreFile=release.jks\n' > key.properties

      - name: Descargar dependencias
        working-directory: budget
        run: flutter pub get

      - name: Compilar APK
        working-directory: budget
        run: flutter build apk --release --target-platform android-arm64

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
