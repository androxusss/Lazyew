name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: stable
          cache: true

      - name: Aplicar cambios de Lazyew
        run: |
          mkdir -p lazyew_patch
          cat > lazyew_patch/lazyewWallet.dart <<'LAZYEW_EOF_1'
          // Lazyew (Fork by Androxus): automatic expense detection from Google Wallet.
          import 'dart:convert';
          import 'package:budget/colors.dart';
          import 'package:budget/database/tables.dart';
          import 'package:budget/functions.dart';
          import 'package:budget/pages/addTransactionPage.dart';
          import 'package:budget/struct/databaseGlobal.dart';
          import 'package:budget/struct/notificationsGlobal.dart';
          import 'package:budget/struct/settings.dart';
          import 'package:budget/widgets/globalSnackbar.dart';
          import 'package:budget/widgets/openSnackbar.dart';
          import 'package:budget/widgets/openPopup.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter_local_notifications/flutter_local_notifications.dart';
          import 'package:notification_listener_service/notification_event.dart';

          const String lazyewWalletPackage = 'com.google.android.apps.walletnfcrel';
          const String lazyewUncategorizedName = 'Uncategorized';

          class LazyewParsedExpense {
            final String merchant;
            final double amount;
            final String? cardLabel;
            final String? walletPk;
            final String? walletName;
            const LazyewParsedExpense(
              this.merchant,
              this.amount, {
              this.cardLabel,
              this.walletPk,
              this.walletName,
            });
          }

          bool lazyewIsWalletPackage(String? packageName) {
            if (packageName == null) return false;
            final String p = packageName.toLowerCase();
            return p == lazyewWalletPackage || p.contains('wallet');
          }

          // Turns "350.00", "1,200.00", "1.250,00" or "2500" into a number.
          double? lazyewParseAmount(String raw) {
            String s = raw.trim().replaceAll(RegExp(r'[.,]+$'), '');
            if (s.isEmpty) return null;
            final int lastDot = s.lastIndexOf('.');
            final int lastComma = s.lastIndexOf(',');
            if (lastDot != -1 && lastComma != -1) {
              if (lastDot > lastComma) {
                s = s.replaceAll(',', '');
              } else {
                s = s.replaceAll('.', '').replaceAll(',', '.');
              }
            } else if (lastComma != -1) {
              final int after = s.length - lastComma - 1;
              if (after == 2) {
                s = s.replaceAll(',', '.');
              } else {
                s = s.replaceAll(',', '');
              }
            } else if (lastDot != -1) {
              final int after = s.length - lastDot - 1;
              final bool manyDots = s.indexOf('.') != lastDot;
              if (manyDots || after == 3) {
                s = s.replaceAll('.', '');
              }
            }
            return double.tryParse(s);
          }

          String lazyewFormatAmount(double value) {
            final String fixed = value.toStringAsFixed(2);
            final List<String> parts = fixed.split('.');
            final String integerPart = parts[0].replaceAllMapped(
                RegExp(r'\B(?=(\d{3})+(?!\d))'), (Match m) => ',');
            return integerPart + '.' + parts[1];
          }

          String _lazyewCleanText(String input) {
            String s = input.replaceAll(
                RegExp(r'\b(google\s+)?wallet\b', caseSensitive: false), ' ');
            s = s.replaceAll(RegExp(r'\s+'), ' ').trim();
            s = s
                .replaceAll(RegExp(r'^[\s\-:|,.]+'), '')
                .replaceAll(RegExp(r'[\s\-:|,.]+$'), '')
                .trim();
            return s;
          }

          // Reads texts like "Kiosko Universitario CRC1,200.00 with VIVE DEBITO ######".
          LazyewParsedExpense? lazyewParseWalletText(String? title, String? content) {
            final List<String> fields = <String>[];
            for (final String? part in <String?>[title, content]) {
              if (part == null) continue;
              for (final String line in part.split('\n')) {
                if (line.trim().isNotEmpty) fields.add(line.trim());
              }
            }
            final RegExp amountRegex =
                RegExp(r'(?:CRC|₡)\s*([0-9][0-9.,]*)', caseSensitive: false);
            int amountField = -1;
            Match? match;
            for (int i = 0; i < fields.length; i++) {
              final Match? m = amountRegex.firstMatch(fields[i]);
              if (m != null) {
                amountField = i;
                match = m;
                break;
              }
            }
            if (match == null) return null;
            final double? amount = lazyewParseAmount(match.group(1) ?? '');
            if (amount == null || amount <= 0) return null;

            final String field = fields[amountField];
            final String before = _lazyewCleanText(field.substring(0, match.start));
            final String after = field.substring(match.end);

            String? cardLabel;
            final Match? withMatch =
                RegExp(r'^\s*(?:with|con)\s+(.+)$', caseSensitive: false)
                    .firstMatch(after);
            if (withMatch != null) {
              final String label = (withMatch.group(1) ?? '')
                  .replaceAll(RegExp(r'[#*•·\d\s]+$'), '')
                  .trim();
              if (label.isNotEmpty) cardLabel = label;
            }

            String merchant = before;
            if (merchant.isEmpty) {
              final List<String> others = <String>[];
              for (int i = 0; i < fields.length; i++) {
                if (i == amountField) continue;
                final String cleaned = _lazyewCleanText(fields[i]);
                if (cleaned.isNotEmpty) others.add(cleaned);
              }
              merchant = others.join(' ');
            }
            if (merchant.isEmpty) merchant = 'Wallet expense';
            return LazyewParsedExpense(merchant, amount, cardLabel: cardLabel);
          }

          // ------------------------------------------------------------------ Log

          List<Map<String, dynamic>> lazyewReadLog() {
            final List<Map<String, dynamic>> out = <Map<String, dynamic>>[];
            final dynamic raw = appStateSettings['lazyewNotifLog'];
            if (raw is List) {
              for (final dynamic entry in raw) {
                if (entry is String) {
                  try {
                    final dynamic decoded = json.decode(entry);
                    if (decoded is Map) {
                      out.add(Map<String, dynamic>.from(decoded));
                    }
                  } catch (_) {}
                }
              }
            }
            return out;
          }

          Future<void> lazyewAddLog(Map<String, dynamic> entry) async {
            final List<String> raw = <String>[];
            final dynamic current = appStateSettings['lazyewNotifLog'];
            if (current is List) {
              for (final dynamic e in current) {
                if (e is String) raw.add(e);
              }
            }
            raw.insert(0, json.encode(entry));
            while (raw.length > 60) {
              raw.removeLast();
            }
            await updateSettings('lazyewNotifLog', raw, updateGlobalState: false);
          }

          Future<void> lazyewClearLog() async {
            await updateSettings('lazyewNotifLog', <String>[], updateGlobalState: false);
          }

          // ------------------------------------------------- Cards and accounts

          Map<String, String> lazyewReadCardMap() {
            final Map<String, String> out = <String, String>{};
            final dynamic raw = appStateSettings['lazyewCardMap'];
            if (raw is Map) {
              raw.forEach((dynamic k, dynamic v) {
                out[k.toString()] = v.toString();
              });
            }
            return out;
          }

          List<String> lazyewReadCardLabels() {
            final List<String> out = <String>[];
            final dynamic raw = appStateSettings['lazyewCardLabels'];
            if (raw is List) {
              for (final dynamic e in raw) {
                out.add(e.toString());
              }
            }
            return out;
          }

          Future<void> lazyewRememberCard(String label) async {
            final List<String> labels = lazyewReadCardLabels();
            if (!labels.contains(label)) {
              labels.add(label);
              await updateSettings('lazyewCardLabels', labels,
                  updateGlobalState: false);
            }
          }

          Future<void> lazyewSetCardAccount(String label, String? walletPk) async {
            final Map<String, String> map = lazyewReadCardMap();
            if (walletPk == null || walletPk.isEmpty) {
              map.remove(label);
            } else {
              map[label] = walletPk;
            }
            await updateSettings('lazyewCardMap', map, updateGlobalState: false);
          }

          String _lazyewNorm(String s) {
            const String from = 'áàäâãéèëêíìïîóòöôõúùüûñç';
            const String to = 'aaaaaeeeeiiiiooooouuuunc';
            final String lower = s.toLowerCase();
            final StringBuffer b = StringBuffer();
            for (final int r in lower.runes) {
              final String ch = String.fromCharCode(r);
              final int i = from.indexOf(ch);
              b.write(i >= 0 ? to[i] : ch);
            }
            return b.toString();
          }

          Future<TransactionWallet?> _lazyewFindWallet(String? walletPk) async {
            if (walletPk == null) return null;
            final List<TransactionWallet> wallets =
                await database.getAllWallets(limit: 1000);
            for (final TransactionWallet w in wallets) {
              if (w.walletPk == walletPk) return w;
            }
            return null;
          }

          // Picks the account for a Wallet card: saved choice, then a name match.
          Future<String?> lazyewWalletForCard(String? cardLabel) async {
            if (cardLabel == null || cardLabel.isEmpty) return null;
            final String? saved = lazyewReadCardMap()[cardLabel];
            if (saved != null && saved.isNotEmpty) return saved;
            final List<TransactionWallet> wallets =
                await database.getAllWallets(limit: 1000);
            final String normLabel = _lazyewNorm(cardLabel);
            for (final TransactionWallet w in wallets) {
              final String n = _lazyewNorm(w.name.trim());
              if (n.isNotEmpty && normLabel.contains(n)) return w.walletPk;
            }
            return null;
          }

          // Reads quick text like "2500 soda BAC" or "BCR 3200 Fitos".
          // An account name anywhere in the text picks that account (the last one
          // mentioned wins). With no account name the default account is used.
          Future<LazyewParsedExpense?> lazyewParseQuick(String text) async {
            final Match? match = RegExp(r'(\d[\d.,]*)').firstMatch(text);
            if (match == null) return null;
            final double? amount = lazyewParseAmount(match.group(1) ?? '');
            if (amount == null || amount <= 0) return null;
            String remainder = text.replaceRange(match.start, match.end, ' ');
            remainder = remainder.replaceAll(RegExp(r'[₡$]'), ' ');

            String? walletPk;
            String? walletName;
            try {
              final List<TransactionWallet> wallets =
                  await database.getAllWallets(limit: 1000);
              final String norm = _lazyewNorm(remainder);
              if (norm.length == remainder.length) {
                int bestStart = -1;
                int bestLength = 0;
                TransactionWallet? best;
                for (final TransactionWallet w in wallets) {
                  final String n = _lazyewNorm(w.name.trim());
                  if (n.isEmpty) continue;
                  final RegExp r =
                      RegExp(r'(?<![a-z0-9])' + RegExp.escape(n) + r'(?![a-z0-9])');
                  for (final Match wm in r.allMatches(norm)) {
                    if (wm.start > bestStart ||
                        (wm.start == bestStart && n.length > bestLength)) {
                      bestStart = wm.start;
                      bestLength = n.length;
                      best = w;
                    }
                  }
                }
                if (best != null) {
                  walletPk = best.walletPk;
                  walletName = best.name;
                  remainder =
                      remainder.replaceRange(bestStart, bestStart + bestLength, ' ');
                }
              }
            } catch (_) {}

            String title = remainder.replaceAll(RegExp(r'\s+'), ' ').trim();
            title = title
                .replaceAll(RegExp(r'^[\s\-:|,.]+'), '')
                .replaceAll(RegExp(r'[\s\-:|,.]+$'), '')
                .trim();
            if (title.isEmpty) title = 'Expense';
            return LazyewParsedExpense(title, amount,
                walletPk: walletPk, walletName: walletName);
          }

          // ---------------------------------------------------- Create the expense

          Future<TransactionCategory> _lazyewUncategorizedCategory() async {
            List<TransactionCategory> all = await database.getAllCategories(limit: 1000);
            for (final TransactionCategory c in all) {
              final String n = c.name.trim().toLowerCase();
              if (n == lazyewUncategorizedName.toLowerCase() || n == 'sin categorizar') {
                return c;
              }
            }
            await database.createOrUpdateCategory(
              TransactionCategory(
                categoryPk: '-1',
                name: lazyewUncategorizedName,
                colour: toHexString(Colors.blueGrey),
                iconName: 'price-tag.png',
                dateCreated: DateTime.now(),
                dateTimeModified: null,
                order: await database.getAmountOfCategories(),
                income: false,
              ),
              insert: true,
            );
            all = await database.getAllCategories(limit: 1000);
            for (final TransactionCategory c in all) {
              if (c.name.trim().toLowerCase() == lazyewUncategorizedName.toLowerCase()) {
                return c;
              }
            }
            return all.first;
          }

          Future<String> lazyewCategoryName(String categoryPk) async {
            final TransactionCategory? c =
                await database.getCategoryInstanceOrNull(categoryPk);
            return c?.name ?? '';
          }

          // Creates an expense ([amount] is positive) and looks up its category by name.
          Future<Transaction?> lazyewCreateExpense({
            required String title,
            required double amount,
            String note = '',
            String? walletPk,
            DateTime? date,
          }) async {
            TransactionCategory? found;
            try {
              final TransactionAssociatedTitleWithCategory? match =
                  (await database.getSimilarAssociatedTitles(title: title, limit: 1))
                      .firstOrNull;
              found = match?.category;
            } catch (_) {
              found = null;
            }
            final TransactionCategory category =
                found ?? await _lazyewUncategorizedCategory();

            String categoryPk = category.categoryPk;
            String? subCategoryPk;
            if (category.mainCategoryPk != null) {
              categoryPk = category.mainCategoryPk!;
              subCategoryPk = category.categoryPk;
            }

            final int? rowId = await database.createOrUpdateTransaction(
              Transaction(
                transactionPk: '-1',
                name: title,
                amount: -amount.abs(),
                note: note,
                categoryFk: categoryPk,
                subCategoryFk: subCategoryPk,
                walletFk: walletPk ?? appStateSettings['selectedWalletPk'],
                dateCreated: date ?? DateTime.now(),
                income: false,
                paid: true,
                skipPaid: false,
                methodAdded: MethodAdded.appLink,
              ),
              insert: true,
            );
            if (rowId == null) return null;
            return await database.getTransactionFromRowId(rowId);
          }

          // ---------------------------------- Expenses typed in the home screen widget

          bool _lazyewDraining = false;

          // The widget saves the typed text natively; the app imports it here.
          Future<List<String>> lazyewDrainPendingQuickAdds() async {
            final List<String> summaries = <String>[];
            if (_lazyewDraining) return summaries;
            _lazyewDraining = true;
            try {
              await sharedPreferences.reload();
              final String? raw = sharedPreferences.getString('lazyew_pending');
              if (raw == null || raw.trim().isEmpty || raw.trim() == '[]') {
                return summaries;
              }
              final dynamic decoded = json.decode(raw);
              await sharedPreferences.setString('lazyew_pending', '[]');
              if (decoded is! List) return summaries;
              for (final dynamic item in decoded) {
                if (item is! Map) continue;
                final String text = (item['text'] ?? '').toString();
                DateTime? when;
                final dynamic ms = item['time'];
                if (ms is num) {
                  when = DateTime.fromMillisecondsSinceEpoch(ms.toInt());
                }
                final Map<String, dynamic> entry = <String, dynamic>{
                  'time': DateTime.now().toIso8601String(),
                  'package': 'home screen widget',
                  'title': '',
                  'content': text,
                  'removed': false,
                  'result': '',
                };
                try {
                  final LazyewParsedExpense? parsed = await lazyewParseQuick(text);
                  if (parsed == null) {
                    entry['result'] = 'Ignored: no amount found';
                  } else {
                    final Transaction? t = await lazyewCreateExpense(
                      title: parsed.merchant,
                      amount: parsed.amount,
                      note: 'Added from widget',
                      walletPk: parsed.walletPk,
                      date: when,
                    );
                    if (t == null) {
                      entry['result'] = 'Error: could not save the expense';
                    } else {
                      entry['result'] = 'Expense created: ' +
                          parsed.merchant +
                          ' / ' +
                          parsed.amount.toString();
                      summaries.add(parsed.merchant + ' ₡' + lazyewFormatAmount(parsed.amount));
                    }
                  }
                } catch (e) {
                  entry['result'] = 'Error: ' + e.toString();
                }
                await lazyewAddLog(entry);
              }
            } catch (_) {
            } finally {
              _lazyewDraining = false;
            }
            return summaries;
          }

          // -------------------------------------------- Notification with 3 buttons

          Future<void> lazyewRequestNotificationPermission() async {
            try {
              await flutterLocalNotificationsPlugin
                  .resolvePlatformSpecificImplementation<
                      AndroidFlutterLocalNotificationsPlugin>()
                  ?.requestNotificationsPermission();
            } catch (_) {}
          }

          Future<void> lazyewShowDetectedNotification(
              Transaction t, String categoryName, String? walletName) async {
            final AndroidNotificationDetails details = AndroidNotificationDetails(
              'lazyewDetected',
              'Detected expenses',
              channelDescription: 'Alerts for expenses detected automatically',
              importance: Importance.high,
              priority: Priority.high,
              actions: <AndroidNotificationAction>[
                AndroidNotificationAction('lazyew_ok', 'Ok!'),
                AndroidNotificationAction('lazyew_edit', 'Edit',
                    showsUserInterface: true),
                AndroidNotificationAction('lazyew_delete', 'Delete',
                    showsUserInterface: true),
              ],
            );
            String body = t.name + '  →  ' + categoryName;
            if (walletName != null && walletName.isNotEmpty) {
              body = body + '  ·  ' + walletName;
            }
            final int notificationId =
                1000 + ((DateTime.now().millisecondsSinceEpoch ~/ 1000) % 1000000);
            await flutterLocalNotificationsPlugin.show(
              notificationId,
              'Expense detected: ₡' + lazyewFormatAmount(t.amount.abs()),
              body,
              NotificationDetails(android: details),
              payload: 'lazyew?transactionPk=' + t.transactionPk,
            );
          }

          // Adds the tapped action (edit / delete) to the payload text.
          String? lazyewPayloadWithAction(String? payload, String? actionId) {
            if (payload == null || !payload.startsWith('lazyew?')) return payload;
            final String action = actionId == 'lazyew_delete' ? 'delete' : 'edit';
            return payload + '&action=' + action;
          }

          Future<bool> lazyewHandlePayload(dynamic context, String payload) async {
            notificationPayload = '';
            final Uri uri = Uri.parse(payload);
            final String? pk = uri.queryParameters['transactionPk'];
            final String action = uri.queryParameters['action'] ?? 'edit';
            if (pk == null) return false;
            Transaction transaction;
            try {
              transaction = await database.getTransactionFromPk(pk);
            } catch (_) {
              openSnackbar(SnackbarMessage(
                title: 'That expense no longer exists',
                icon: Icons.info_outline_rounded,
              ));
              return true;
            }
            if (action == 'delete') {
              await database.deleteTransaction(pk);
              openSnackbar(SnackbarMessage(
                title: 'Expense deleted',
                description: transaction.name,
                icon: Icons.delete_outline_rounded,
              ));
              return true;
            }
            pushRoute(
              context,
              AddTransactionPage(
                transaction: transaction,
                routesToPopAfterDelete: RoutesToPopAfterDelete.One,
              ),
            );
            return true;
          }

          // --------------------------------------------- Main entry (Wallet events)

          DateTime? _lazyewLastTime;
          String? _lazyewLastKey;

          // Returns true if the notification came from Wallet and was handled here.
          Future<bool> lazyewHandleNotificationEvent(
              ServiceNotificationEvent event) async {
            if (appStateSettings['lazyewWalletCapture'] != true) return false;
            final String? packageName = event.packageName;
            final LazyewParsedExpense? parsed =
                lazyewParseWalletText(event.title, event.content);
            final bool isWallet = lazyewIsWalletPackage(packageName);
            if (!isWallet && parsed == null) return false;

            final Map<String, dynamic> entry = <String, dynamic>{
              'time': DateTime.now().toIso8601String(),
              'package': packageName ?? '',
              'title': event.title ?? '',
              'content': event.content ?? '',
              'removed': event.hasRemoved == true,
              'result': '',
            };

            try {
              if (!isWallet) {
                entry['result'] = 'Ignored: not from Wallet';
                await lazyewAddLog(entry);
                return false;
              }
              if (event.hasRemoved == true) {
                entry['result'] = 'Ignored: notification dismissed event';
                await lazyewAddLog(entry);
                return true;
              }
              if (parsed == null) {
                entry['result'] = 'Ignored: no CRC amount found';
                await lazyewAddLog(entry);
                return true;
              }
              final String key = parsed.merchant +
                  '|' +
                  parsed.amount.toString() +
                  '|' +
                  (parsed.cardLabel ?? '');
              final DateTime now = DateTime.now();
              if (_lazyewLastKey == key &&
                  _lazyewLastTime != null &&
                  now.difference(_lazyewLastTime!).inSeconds < 30) {
                entry['result'] = 'Ignored: duplicate';
                await lazyewAddLog(entry);
                return true;
              }
              _lazyewLastKey = key;
              _lazyewLastTime = now;

              if (parsed.cardLabel != null) {
                await lazyewRememberCard(parsed.cardLabel!);
              }
              final String? walletPk = await lazyewWalletForCard(parsed.cardLabel);

              final Transaction? t = await lazyewCreateExpense(
                title: parsed.merchant,
                amount: parsed.amount,
                note: 'Detected from Wallet' +
                    (parsed.cardLabel != null ? ' (' + parsed.cardLabel! + ')' : ''),
                walletPk: walletPk,
              );
              if (t == null) {
                entry['result'] = 'Error: could not save the expense';
                await lazyewAddLog(entry);
                return true;
              }
              final String categoryName = await lazyewCategoryName(t.categoryFk);
              final TransactionWallet? wallet = await _lazyewFindWallet(t.walletFk);
              entry['result'] = 'Expense created: ' +
                  parsed.merchant +
                  ' / CRC ' +
                  parsed.amount.toString() +
                  ' / ' +
                  categoryName +
                  ' / card: ' +
                  (parsed.cardLabel ?? 'none') +
                  ' / account: ' +
                  (wallet?.name ?? 'default');
              await lazyewAddLog(entry);
              await lazyewShowDetectedNotification(t, categoryName, wallet?.name);
            } catch (e) {
              entry['result'] = 'Error: ' + e.toString();
              try {
                await lazyewAddLog(entry);
              } catch (_) {}
            }
            return true;
          }
          LAZYEW_EOF_1
          cat > lazyew_patch/lazyewPages.dart <<'LAZYEW_EOF_2'
          // Lazyew (Fork by Androxus): extra screens (Wallet log, quick add, settings).
          import 'package:budget/database/tables.dart';
          import 'package:budget/pages/autoTransactionsPageEmail.dart';
          import 'package:budget/pages/editHomePage.dart';
          import 'package:budget/struct/databaseGlobal.dart';
          import 'package:budget/struct/lazyewWallet.dart';
          import 'package:budget/struct/settings.dart';
          import 'package:budget/widgets/globalSnackbar.dart';
          import 'package:budget/widgets/openSnackbar.dart';
          import 'package:budget/widgets/settingsContainers.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:notification_listener_service/notification_listener_service.dart';

          // Subtle "Fork by Androxus" tag + quick add field ("2500 soda BAC").
          class LazyewHomeExtras extends StatefulWidget {
            const LazyewHomeExtras({super.key});

            @override
            State<LazyewHomeExtras> createState() => _LazyewHomeExtrasState();
          }

          class _LazyewHomeExtrasState extends State<LazyewHomeExtras>
              with WidgetsBindingObserver {
            final TextEditingController _controller = TextEditingController();
            bool _busy = false;

            @override
            void initState() {
              super.initState();
              WidgetsBinding.instance.addObserver(this);
              _importWidgetExpenses();
            }

            @override
            void dispose() {
              WidgetsBinding.instance.removeObserver(this);
              _controller.dispose();
              super.dispose();
            }

            @override
            void didChangeAppLifecycleState(AppLifecycleState state) {
              if (state == AppLifecycleState.resumed) {
                _importWidgetExpenses();
              }
            }

            // Imports expenses typed in the home screen widget while the app was closed.
            Future<void> _importWidgetExpenses() async {
              try {
                final List<String> added = await lazyewDrainPendingQuickAdds();
                if (added.isNotEmpty) {
                  openSnackbar(SnackbarMessage(
                    title: 'Added ' +
                        added.length.toString() +
                        ' expense(s) from the widget',
                    description: added.take(3).join(', '),
                    icon: Icons.check_circle_outline_rounded,
                  ));
                }
              } catch (_) {}
            }

            Future<void> _submit(String value) async {
              if (_busy) return;
              final LazyewParsedExpense? parsed = await lazyewParseQuick(value);
              if (parsed == null) {
                openSnackbar(SnackbarMessage(
                  title: 'Type an amount and a description',
                  description: 'Example: 2500 soda BAC',
                  icon: Icons.info_outline_rounded,
                ));
                return;
              }
              setState(() {
                _busy = true;
              });
              try {
                final Transaction? t = await lazyewCreateExpense(
                  title: parsed.merchant,
                  amount: parsed.amount,
                  walletPk: parsed.walletPk,
                );
                if (t != null) {
                  final String categoryName = await lazyewCategoryName(t.categoryFk);
                  _controller.clear();
                  FocusManager.instance.primaryFocus?.unfocus();
                  String description = parsed.merchant +
                      ' · ₡' +
                      lazyewFormatAmount(parsed.amount) +
                      '  →  ' +
                      categoryName;
                  if (parsed.walletName != null) {
                    description = description + '  ·  ' + parsed.walletName!;
                  }
                  openSnackbar(SnackbarMessage(
                    title: 'Expense added',
                    description: description,
                    icon: Icons.check_circle_outline_rounded,
                  ));
                }
              } catch (e) {
                openSnackbar(SnackbarMessage(
                  title: 'Could not add the expense',
                  description: e.toString(),
                  icon: Icons.warning_amber_rounded,
                ));
              }
              if (mounted) {
                setState(() {
                  _busy = false;
                });
              }
            }

            @override
            Widget build(BuildContext context) {
              final bool showTag = appStateSettings['lazyewForkTag'] != false;
              final bool showQuick = appStateSettings['lazyewQuickEntry'] != false;
              if (!showTag && !showQuick) return const SizedBox.shrink();
              final Color faint =
                  Theme.of(context).colorScheme.onSurface.withOpacity(0.28);
              return Padding(
                padding: const EdgeInsetsDirectional.only(
                    start: 16, end: 16, top: 4, bottom: 8),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.stretch,
                  children: [
                    if (showTag)
                      Align(
                        alignment: AlignmentDirectional.centerEnd,
                        child: Text(
                          'Fork by Androxus',
                          style: TextStyle(fontSize: 10, color: faint),
                        ),
                      ),
                    if (showTag && showQuick) const SizedBox(height: 4),
                    if (showQuick)
                      TextField(
                        controller: _controller,
                        textInputAction: TextInputAction.done,
                        onSubmitted: _submit,
                        decoration: InputDecoration(
                          isDense: true,
                          hintText: 'Quick add: 2500 soda BAC',
                          prefixIcon: const Icon(Icons.bolt_rounded),
                          suffixIcon: IconButton(
                            icon: const Icon(Icons.send_rounded),
                            onPressed: () {
                              _submit(_controller.text);
                            },
                          ),
                          border: OutlineInputBorder(
                            borderRadius: BorderRadius.circular(15),
                          ),
                        ),
                      ),
                  ],
                ),
              );
            }
