          package com.budget.tracker_app;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.DialogInterface;
          import android.content.SharedPreferences;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.view.inputmethod.EditorInfo;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.TextView;
          import android.widget.Toast;
          import org.json.JSONArray;
          import org.json.JSONObject;

          // Small popup (no app screen) used by the Lazyew quick add widget.
          // It saves the typed text in a queue that the app imports the next time it
          // opens. The app does the parsing (amount, account, category).
          public class LazyewQuickAddActivity extends Activity {

              private static final String PREFS = "FlutterSharedPreferences";
              private static final String KEY = "flutter.lazyew_pending";

              private AlertDialog dialog;
              private EditText input;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  input = new EditText(this);
                  input.setHint("2500 soda BAC");
                  input.setSingleLine(true);
                  input.setImeOptions(EditorInfo.IME_ACTION_DONE);

                  float density = getResources().getDisplayMetrics().density;
                  int pad = (int) (20 * density);
                  FrameLayout container = new FrameLayout(this);
                  container.setPadding(pad, pad / 2, pad, 0);
                  container.addView(input, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.WRAP_CONTENT));

                  dialog = new AlertDialog.Builder(this)
                          .setTitle("Quick expense")
                          .setMessage("Amount, description and optionally an account name.")
                          .setView(container)
                          .setPositiveButton("Add", null)
                          .setNegativeButton("Cancel", new DialogInterface.OnClickListener() {
                              @Override
                              public void onClick(DialogInterface d, int which) {
                                  finish();
                              }
                          })
                          .create();

                  dialog.setOnCancelListener(new DialogInterface.OnCancelListener() {
                      @Override
                      public void onCancel(DialogInterface d) {
                          finish();
                      }
                  });

                  if (dialog.getWindow() != null) {
                      dialog.getWindow().setSoftInputMode(WindowManager.LayoutParams.SOFT_INPUT_STATE_VISIBLE);
                  }
                  dialog.show();

                  dialog.getButton(AlertDialog.BUTTON_POSITIVE).setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) {
                          submit();
                      }
                  });

                  input.setOnEditorActionListener(new TextView.OnEditorActionListener() {
                      @Override
                      public boolean onEditorAction(TextView v, int actionId, KeyEvent event) {
                          submit();
                          return true;
                      }
                  });

                  input.requestFocus();
              }

              private void submit() {
                  String text = input.getText().toString().trim();
                  if (text.length() == 0) {
                      Toast.makeText(this, "Type an amount and a description", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  if (!text.matches(".*\\d.*")) {
                      Toast.makeText(this, "Include an amount, e.g. 2500 soda", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  try {
                      SharedPreferences prefs = getSharedPreferences(PREFS, MODE_PRIVATE);
                      String raw = prefs.getString(KEY, "[]");
                      JSONArray array;
                      try {
                          array = new JSONArray(raw);
                      } catch (Exception e) {
                          array = new JSONArray();
                      }
                      JSONObject item = new JSONObject();
                      item.put("text", text);
                      item.put("time", System.currentTimeMillis());
                      array.put(item);
                      prefs.edit().putString(KEY, array.toString()).commit();
                      Toast.makeText(this, "Saved: " + text + " (it appears in Lazyew when you open it)", Toast.LENGTH_LONG).show();
                  } catch (Exception e) {
                      Toast.makeText(this, "Could not save the expense", Toast.LENGTH_LONG).show();
                  }
                  dialog.dismiss();
                  finish();
              }

              @Override
              protected void onDestroy() {
                  if (dialog != null && dialog.isShowing()) {
                      dialog.dismiss();
                  }
                  super.onDestroy();
              }
          }
