          // Lazyew quick add widget: tapping it opens a small popup to type an expense.
          public class LazyewQuickWidgetProvider extends AppWidgetProvider {

              @Override
              public void onUpdate(Context context, AppWidgetManager appWidgetManager, int[] appWidgetIds) {
                  for (int i = 0; i < appWidgetIds.length; i++) {
                      RemoteViews views = new RemoteViews(context.getPackageName(), R.layout.lazyew_quick_widget);

