          import os, shutil, sys

          SRC = os.path.dirname(os.path.abspath(__file__))
          ROOT = sys.argv[1]  # carpeta "budget"


          def rep(rel, old, new):
              path = os.path.join(ROOT, rel)
              with open(path, encoding="utf-8") as f:
                  text = f.read()
              if text.count(old) != 1:
                  raise SystemExit("NO SE ENCONTRO (o esta repetido) en %s:\n%s" % (rel, old))
              with open(path, "w", encoding="utf-8") as f:
                  f.write(text.replace(old, new))


          shutil.copy(os.path.join(SRC, "lazyewWallet.dart"), os.path.join(ROOT, "lib/struct/lazyewWallet.dart"))
          shutil.copy(os.path.join(SRC, "lazyewPages.dart"), os.path.join(ROOT, "lib/pages/lazyewPages.dart"))

          # 1) Nombre de la app
          rep("android/app/src/main/AndroidManifest.xml", 'android:label="Cashew"', 'android:label="Lazyew"')
